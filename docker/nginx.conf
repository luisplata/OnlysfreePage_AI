# Réplica de la semántica de app/.htaccess, sin Apache:
#   1. archivo o directorio existente se sirve tal cual
#   2. /products/detail sirve /products/detail.html
#   3. lo que no existe devuelve 404.html con estado 404 real

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip para el peso de JS, CSS y JSON del export
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # Los assets de /_next/static/ llevan hash en el nombre: cache larga e inmutable
    location /_next/static/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Clean URLs del export (como la regla de .htaccess)
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # 404 de Next con estado 404. `internal` evita que /404.html se pida
    # directamente como si fuera una página normal.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
