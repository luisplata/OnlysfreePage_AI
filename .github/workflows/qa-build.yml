# Build de QA: compila el export estatico y entrega un ZIP autocontenido de 1 dia.
# El orden importa: typecheck y tests van ANTES del build porque next.config.ts
# tiene ignoreBuildErrors: true y un build "verde" puede estar roto.
name: QA build

on:
  workflow_dispatch:
  push:
    branches: [main]

# Solo lectura: este workflow no escribe en el repo.
permissions:
  contents: read

# Un push nuevo a la misma ref cancela el run viejo: solo importa el ultimo commit.
concurrency:
  group: qa-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa-artifact:
    name: Build QA artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Gate de tipos: next build los ignoraria, asi que se cortan aca.
      - name: Typecheck
        run: npm run typecheck

      # Gate de tests: rojo = sin artefacto.
      - name: Tests
        run: npm test

      # NEXT_PUBLIC_* se inlinea al compilar: solo cuenta el valor presente aca.
      # Front QA = ai.onlysfree.com; backend QA = test.onlysfree.com.
      - name: Build con URLs de QA
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.QA_API_URL || 'https://test.onlysfree.com/api' }}
          NEXT_PUBLIC_WEB_URL: ${{ vars.QA_WEB_URL || 'https://ai.onlysfree.com' }}
        run: npm run build

      # Next solo copia public/ (que no existe): el .htaccess viaja a mano.
      - name: Copiar .htaccess al export
        run: cp app/.htaccess out/.htaccess

      # Si falta cualquiera de estas piezas, no hay artefacto.
      - name: Guardas del export
        run: |
          set -euo pipefail
          test -f out/index.html
          test -f out/404.html
          test -f out/.htaccess
          # Sin assets JS no hay app, aunque el HTML exista.
          test -n "$(find out/_next/static -name '*.js' -print -quit)"
          # El default de src/lib/api.ts es PRODUCCION: si aparece en el export,
          # el build se hizo sin las URLs de QA. -I ignora binarios, -l dice donde.
          if grep -RIl 'admin\.onlysfree\.com' out; then
            echo "::error::El export contiene admin.onlysfree.com (URL de produccion)"
            exit 1
          fi

      # Zip propio: nombre exacto y contenido demostrable. El punto recursa
      # dotfiles (con * el .htaccess queda afuera y Apache devuelve 404).
      - name: Empaquetar y verificar ZIP
        run: |
          set -euo pipefail
          NAME="onlysfree-qa-${GITHUB_SHA::7}-run${GITHUB_RUN_NUMBER}"
          echo "ARTIFACT_ZIP=${NAME}.zip" >> "$GITHUB_ENV"
          # zip -r sobre un archivo existente actualiza entradas pero no borra
          # las que ya no estan en out/: se arranca limpio.
          rm -f "${NAME}.zip"
          ( cd out && zip -r "../${NAME}.zip" . )
          # El listado va a un archivo: unzip | grep -q con pipefail puede morir
          # por SIGPIPE cuando .htaccess aparece temprano y el ZIP es grande.
          unzip -l "${NAME}.zip" > "${RUNNER_TEMP:-/tmp}/zip-listing.txt"
          grep -qE '(^|[[:space:]])(\./)?\.htaccess$' "${RUNNER_TEMP:-/tmp}/zip-listing.txt"

      # archive: false sube el ZIP tal cual y exige UN solo archivo: con el, el
      # input name se ignora y el artefacto toma el nombre del archivo, que ya
      # es el correcto. Ese input existe desde upload-artifact v7.0.0; v7 es la
      # version minima que lo soporta (v4 lo ignoraba y re-zipeaba).
      - name: Subir artefacto
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.ARTIFACT_ZIP }}
          archive: false
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true

      # --- Deploy a QA (ai.onlysfree.com) ---
      # La llave es dedicada: en authorized_keys lleva no-pty, sin forwarding y
      # sin user-rc. El host key va pineado por secret, asi que nunca hace falta
      # StrictHostKeyChecking=no.
      - name: Configurar SSH de deploy
        env:
          SSH_PRIVATE_KEY: ${{ secrets.QA_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.QA_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/qa_deploy
          chmod 600 ~/.ssh/qa_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          # Falla aca y no en rsync si la llave quedo mal pegada en el secret.
          ssh-keygen -y -f ~/.ssh/qa_deploy > /dev/null

      # Sin red de seguridad no se toca el docroot: el tar.gz queda en ~/qa_backup.
      - name: Backup del docroot remoto
        env:
          QA_SSH_HOST: ${{ vars.QA_SSH_HOST }}
          QA_SSH_PORT: ${{ vars.QA_SSH_PORT }}
          QA_SSH_USER: ${{ vars.QA_SSH_USER }}
          QA_DEPLOY_PATH: ${{ vars.QA_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          STAMP=$(date -u +%Y%m%d_%H%M%S)
          BACKUP="ai-${GITHUB_SHA:0:7}-${STAMP}.tar.gz"
          ssh -i ~/.ssh/qa_deploy -p "$QA_SSH_PORT" -o IdentitiesOnly=yes \
            "$QA_SSH_USER@$QA_SSH_HOST" \
            "mkdir -p ~/qa_backup && tar czf ~/qa_backup/$BACKUP -C ~/$QA_DEPLOY_PATH . && ls -lh ~/qa_backup/$BACKUP"

      # --delete limpia archivos viejos del docroot, pero los excludes los
      # protegen: .well-known (certificados) y out.zip (respaldo manual).
      - name: Sincronizar export a QA
        env:
          QA_SSH_HOST: ${{ vars.QA_SSH_HOST }}
          QA_SSH_PORT: ${{ vars.QA_SSH_PORT }}
          QA_SSH_USER: ${{ vars.QA_SSH_USER }}
          QA_DEPLOY_PATH: ${{ vars.QA_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          rsync -az --delete \
            --exclude '.well-known/' \
            --exclude 'out.zip' \
            -e "ssh -i $HOME/.ssh/qa_deploy -p $QA_SSH_PORT -o IdentitiesOnly=yes" \
            out/ "$QA_SSH_USER@$QA_SSH_HOST:~/$QA_DEPLOY_PATH/"

      # Un deploy que no sirve rutas no es un deploy: si esto falla, el run falla.
      - name: Smoke test de QA
        run: |
          set -euo pipefail
          check() {
            code=$(curl -sS -o /dev/null -w '%{http_code}' -m 20 "$1")
            echo "$code  $1"
            [ "$code" = "200" ]
          }
          check "https://ai.onlysfree.com/"
          check "https://ai.onlysfree.com/products/detail?id=4476"
          check "https://ai.onlysfree.com/deals/daily"
          check "https://ai.onlysfree.com/search/query"

      # Dos cosas distintas:
      #   1) el rsync dejo el build en el docroot -> se prueba con cache-buster,
      #      que saltea el proxy y es lo unico que este workflow controla.
      #   2) la URL limpia (la que ve el visitante) puede seguir sirviendo la
      #      copia anterior por el cache del server. Eso no lo arregla el deploy:
      #      se avisa como warning para no tapar el problema con un verde falso,
      #      ni romper el CI por algo ajeno al build.
      - name: Verificar version en vivo (buildId)
        run: |
          set -euo pipefail
          EXPECTED=$(grep -o '"buildId":"[^"]*"' out/index.html | head -1 | cut -d'"' -f4)
          echo "buildId build: $EXPECTED"

          BUSTED=$(curl -sS -m 20 "https://ai.onlysfree.com/?cb=${GITHUB_RUN_ID}" | grep -o '"buildId":"[^"]*"' | head -1 | cut -d'"' -f4 || true)
          echo "buildId servido (sin cache): ${BUSTED:-vacio}"
          if [ "$BUSTED" != "$EXPECTED" ]; then
            echo "::error::El docroot no sirve este build: build=$EXPECTED servido=${BUSTED:-vacio}"
            exit 1
          fi

          for i in $(seq 1 12); do
            LIVE=$(curl -sS -m 20 https://ai.onlysfree.com/ | grep -o '"buildId":"[^"]*"' | head -1 | cut -d'"' -f4 || true)
            if [ "$LIVE" = "$EXPECTED" ]; then
              echo "OK: la URL limpia ya sirve $EXPECTED"
              exit 0
            fi
            echo "intento $i: la URL limpia aun sirve ${LIVE:-vacio}"
            sleep 10
          done
          echo "::warning::El deploy es correcto, pero https://ai.onlysfree.com/ sigue sirviendo ${LIVE:-nada} (cache del server sin purgar). Visitantes ven el build anterior hasta que expire."
          exit 0
